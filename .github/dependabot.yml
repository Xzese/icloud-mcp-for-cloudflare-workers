version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    # Security fixes run when alerts arrive, separately from scheduled bumps.
    groups:
      security-npm:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    groups:
      security-actions:
        applies-to: security-updates
        patterns: ["*"]
