name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out or execute dependency PR code
      # in this write-token workflow; the separate CI runs with read permissions.
      # Include major and multi-ecosystem updates. Branch protection requires
      # all four CI checks, an up-to-date branch and resolved conversations.
      - name: Enable squash auto-merge for dependency updates
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          PR_URL: "${{ github.event.pull_request.html_url }}"
